name: Deploy Backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure remote path exists
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          script: mkdir -p "/home/fuelsmart/agentic.fuelsmart.io"

      - name: Create deployment archive
        run: |
          find . -type f \
            ! -path './.git/*' \
            ! -path './node_modules/*' \
            ! -path './backup/*' \
            ! -path './uploads/*' \
            ! -path './temp/*' \
            ! -name 'deploy.tar.gz' \
            ! -name '*.log' \
            ! -name '*.zip' \
            ! -name '*.tar.gz' \
            ! -name '*.mp4' \
            ! -name '*.avi' \
            ! -name '*.mkv' \
            ! -name '*.iso' \
            ! -size +10M \
            -print0 | tar --null --files-from=- -czf deploy.tar.gz

      - name: Upload project files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          source: "deploy.tar.gz"
          target: /home/fuelsmart/agentic.fuelsmart.io

      - name: Install production dependencies on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          script: |
            cd "/home/fuelsmart/agentic.fuelsmart.io"
            tar -xzf deploy.tar.gz
            rm -f deploy.tar.gz
            npm ci --omit=dev