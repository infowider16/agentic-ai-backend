name: Deploy Backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure remote path exists
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          script: mkdir -p "/home/fuelsmart/agentic.fuelsmart.io"

      - name: Upload project files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          source: "."
          ignore:
            - "node_modules/**"
            - "*.log"
            - "*.zip"
            - "*.tar.gz"
            - "*.mp4"
            - "*.avi"
            - "*.mkv"
            - "*.iso"
            - "backup/**"
            - "uploads/**"
            - "temp/**"
            
          # Exclude files larger than 10MB
          ignore_by_size: "10MB"
          target: /home/fuelsmart/agentic.fuelsmart.io

      - name: Install production dependencies on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          script: |
            cd "/home/fuelsmart/agentic.fuelsmart.io"
            npm ci --omit=dev